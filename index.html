<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GathSession</title>

  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
  <nav class="navbar">
    <img src="ICONOS/GathSession..png" class="logo" alt="GathSession">

    <ul class="menu">
      <li><a href="#">Home</a></li>
      <li><a href="#">Features</a></li>
      <li><a href="#">Blog</a></li>
      <li><a href="#">Contact</a></li>
      <li><a href="#">About us</a></li>
    </ul>
  </nav>
</header>

<section class="hero">

  
  <div class="hero-left">

    <h1>
      Build your best <br>
      community <br>
      starting from here.
    </h1>

    <p>
  Meet and communicate with the best people to run<br>
  projects, events or other activities in a more effective<br>
  and fun way
    </p>

    <div class="hero-buttons">
      <button class="primary">Get started</button>

      <button class="secondary">
        <span>Learn more</span>
        <img src="ICONOS/arrow.png" alt="arrow" class="arrow-icon">
      </button>
    </div>

    <div class="items">
      <div class="item">
        <img src="ICONOS/build-comm.png">
        <span>Build community</span>
      </div>

      <div class="item">
        <img src="ICONOS/share-events.png">
        <span>Share events</span>
      </div>

      <div class="item">
        <img src="ICONOS/get-info.png">
        <span>Get information</span>
      </div>
    </div>

  </div>

  
  <div class="hero-right">

    <div class="card morado">
      <img src="ICONOS/hombre-morado.png">
    </div>

    <div class="card azul">
      <img src="ICONOS/mujer-azul.png">
    </div>

    <div class="card amarillo">
      <img src="ICONOS/mujer-amarillo.png">
    </div>

    <div class="card rosa">
      <img src="ICONOS/mujer-rosa.png">
    </div>

    <div class="card naranja">
      <img src="ICONOS/hombre-naranja.png">
    </div>

  </div>

</section>
